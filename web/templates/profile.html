<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostr Profile</title>
    <link rel="stylesheet" href="./assets/css/profile.css">
    <link rel="stylesheet" href="./assets/css/modal.css">
</head>
<body>
    <div class="profile-container">
        <!-- Banner Section -->
        <div class="banner-wrapper" id="bannerPreview" style="background-image: url('{{.Profile.Banner}}');">
        <!-- <div class="banner-wrapper" id="bannerPreview" style="background-image: url('https://placehold.co/150x150/6c5ce7/ffffff?text=Banner');"> -->
        </div>

        <!-- Avatar Section -->
        <div class="avatar-wrapper">
            <div class="avatar" id="avatarPreview" style="background-image: url('{{.Profile.Picture}}');"></div>
            <!-- <div class="avatar" id="avatarPreview" style="background-image: url('https://placehold.co/150x150/6c5ce7/ffffff?text=User');"></div> -->
        </div>

        <!-- Form Section -->
        <div class="form-content">
            <form id="profile-form">
                <h1>Edit Profile</h1>
                <span class="handle">@{{.Pubkey}}</span>
                <input type="text" id="pubkey" name="pubkey" style="visibility: hidden; display: none;" value={{.Pubkey}}>

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Full legal name" value="{{.Profile.Name}}">
                </div>

                <div class="form-group">
                    <label for="display_name">Display Name</label>
                    <input type="text" id="display_name" name="display_name" placeholder="e.g. John Doe" value="{{.Profile.DisplayName}}">
                </div>

                <div class="form-group">
                    <label for="nip05">NIP-05</label>
                    <input type="text" id="nip05" name="nip05" placeholder="name@example.com" value="{{.Profile.Nip05}}">
                    <div class="helper-text">Nostr Identity Verification</div>
                </div>

                <div class="form-group">
                    <label for="lud16">Lightning Address</label>
                    <input type="text" id="lud16" name="lud16" placeholder="name@getalby.com" value="{{.Profile.Lud16}}">
                    <div class="helper-text">For receiving sats</div>
                </div>

                <div class="form-group">
                    <label for="banner">Banner Image URL</label>
                    <input type="url" id="banner" name="banner" placeholder="https://example.com/banner.jpg" value="{{.Profile.Banner}}">
                </div>

                <div class="form-group">
                    <label for="picture">Profile Icon URL</label>
                    <input type="url" id="picture" name="picture" placeholder="https://example.com/avatar.jpg" value="{{.Profile.Picture}}">
                </div>

                <div class="form-group">
                    <label for="website">Website URL</label>
                    <input type="url" id="website" name="website" placeholder="https://example.mywebsite.com" value="{{.Profile.Website}}">
                </div>

                <div class="form-group">
                    <label for="about">About</label>
                    <textarea id="about" name="about" placeholder="Tell us a little about yourself...">{{.Profile.About}}</textarea>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='./home'" >Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-profile-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
 
    <!-- Modal Container -->
    <div id="custom-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Title</h3>
                <button id="modal-close" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modal-message">Status Message Here</p>
            </div>
            <div class="modal-footer" id="modal-footer">
                <!-- Buttons will be injected here by JS -->
            </div>
        </div>
    </div>

    <script src="./assets/js/profile.js"></script>
    <script src="./assets/js/modal.js"></script>
</body>
</html>
